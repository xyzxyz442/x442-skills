name: no-rm

# The owner's rule is `trash`, never `rm`. Shipped tooling has one narrow exception: `rm -f` on a
# named file it created itself, then `rmdir`. Never a recursive delete. The pre-commit hook
# catches a violation locally; this catches it when the hook was bypassed or never installed.
#
# Rule: AGENTS.md, House rules. Rationale: docs/adr/0028-shipped-tooling-deletes-only-a-named-file-it-created.md.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify-no-rm:
    name: no recursive or unnamed deletes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify the rm exception shape
        run: bash scripts/verify-no-rm.sh
