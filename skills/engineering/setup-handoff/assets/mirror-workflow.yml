# GENERATED by the setup-handoff skill (--with-mirror-workflow). Re-run it to update this file.
#
# Projects this board's open work into its issue tracker (ADR 0011), once per section it hosts.
# The projection is ONE WAY: issues are written, the board is not, and an edit made in the tracker
# is overwritten on the next run. Nothing here can change a handoff's status — that happens on the
# board, with evidence.
#
# NO TOKEN VALUE APPEARS IN THIS FILE, and none may ever be added. __TOKEN_NOTE__
name: handoff mirror

on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:

# Serialised, and never cancelled mid-flight. Two mirrors running at once would each read the
# tracker before the other had written it, and both would open the same issue; cancelling one
# half-way leaves the board's sections partly projected with no record of which.
concurrency:
  group: handoff-mirror
  cancel-in-progress: false

permissions:
  contents: write # only ever to commit TRACKER-DRIFT.md back
  issues: write # the projection itself

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the BRANCH, not the detached commit: this job may push a drift report back.
          ref: ${{ github.ref_name }}

      - name: Mirror each section into the tracker
        working-directory: __BOARD_PATH__
        env:
          GH_TOKEN: __TOKEN_EXPR__
        run: |
          set -uo pipefail
          # Sections this board hosts, rendered by setup-handoff from the board's own config.
          SECTIONS="__SECTIONS__"
          rc=0
          for section in $SECTIONS; do
            # Up to three attempts. A mirror run can fail part-way on a transient GitHub error
            # (a GraphQL 502 was seen in practice), and the adapter correctly fails the run rather
            # than continuing blind. Retrying is safe and is the whole point of matching issues by
            # a hidden marker instead of a stored number: a re-run resumes where it stopped and
            # opens no duplicates.
            for attempt in 1 2 3; do
              echo "::group::mirror $section (attempt $attempt)"
              HANDOFF_GROUP="$section" ./handoff mirror
              status=$?
              echo "::endgroup::"
              [ $status -eq 0 ] && break
              if [ $attempt -eq 3 ]; then
                echo "::error::mirror failed for section $section after 3 attempts"
                rc=1
              else
                echo "::warning::mirror failed for section $section, retrying"
                sleep $((attempt * 5))
              fi
            done
          done
          exit $rc

      - name: Commit the drift report if it changed
        # `always()` so a divergence found before a later section failed is still recorded. The
        # report is what a reader acts on; losing it because an unrelated section errored would
        # hide the one thing the run learned.
        if: always()
        working-directory: __BOARD_PATH__
        run: |
          set -uo pipefail
          # TRACKER-DRIFT.md is generated: written when a divergence appears, left untouched while
          # it stands, and DELETED when it clears. So all three of created, unchanged and removed
          # are normal, and the common case is no change at all — commit only when something moved,
          # or this job appends an empty commit to the board on every push forever.
          git add -A
          if git diff --cached --quiet; then
            echo "no drift change — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(board): refresh tracker drift report

          Generated by the handoff mirror. Drift is reported, never reconciled — a
          close made in the tracker never becomes \`done\` on the board (ADR 0014)."
          git push
