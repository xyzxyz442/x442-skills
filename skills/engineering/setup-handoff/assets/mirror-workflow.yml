# GENERATED by the setup-handoff skill (--with-mirror-workflow). Re-run it to update this file.
#
# Projects this board's open work into its issue tracker (ADR 0011), once per section it hosts.
# The projection is ONE WAY: issues are written, the board is not, and an edit made in the tracker
# is overwritten on the next run. Nothing here can change a handoff's status — that happens on the
# board, with evidence.
#
# NO TOKEN VALUE APPEARS IN THIS FILE, and none may ever be added. __TOKEN_NOTE__
name: handoff mirror

on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:

# Serialised, and never cancelled mid-flight. Two mirrors running at once would each read the
# tracker before the other had written it, and both would open the same issue; cancelling one
# half-way leaves the board's sections partly projected with no record of which.
concurrency:
  group: handoff-mirror
  cancel-in-progress: false

permissions:
  contents: write # only ever to commit TRACKER-DRIFT.md back
  issues: write # the projection itself

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # Plain git, not actions/checkout: this job runs no JavaScript action and so needs no Node
      # runtime at all (the mirror is bash + python3). A JavaScript action pins the job to whatever
      # Node release the runner happens to ship, which a board's own Node floor may be above.
      - name: Check out the board
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c init.defaultBranch=main init -q .
          # The same auth actions/checkout sets up: an extra header, so the drift step's push works
          # without the token ever being written into the remote URL.
          basic="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $basic"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          # FULL history. A board's identity is derived from its repository's ROOT commit, and a
          # shallow checkout reports the commit it fetched as that root — a different one after
          # every push, so each run would look like a different board and be refused the tracker
          # the run before it had just written (ADR 0017). The CLI refuses a shallow board outright.
          git fetch -q origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          # The BRANCH, not the detached commit, tracking origin: this job may push a drift report
          # back, and that step's bare `git push` needs an upstream.
          git checkout -q -B "$GITHUB_REF_NAME" --track "origin/$GITHUB_REF_NAME"

      - name: Mirror each section into the tracker
        working-directory: __BOARD_PATH__
        env:
          GH_TOKEN: __TOKEN_EXPR__
        run: |
          set -uo pipefail
          # Sections this board hosts, rendered by setup-handoff from the board's own config.
          SECTIONS="__SECTIONS__"
          rc=0
          # A board with no sections is mirrored once, whole: an empty HANDOFF_GROUP is the same
          # as none. Looping over an empty $SECTIONS would run zero passes and still go green.
          set -- $SECTIONS
          [ $# -gt 0 ] || set -- ""
          for section in "$@"; do
            label="${section:-board}"
            # Up to three attempts. A mirror run can fail part-way on a transient GitHub error
            # (a GraphQL 502 was seen in practice), and the adapter correctly fails the run rather
            # than continuing blind. Retrying is safe and is the whole point of matching issues by
            # a hidden marker instead of a stored number: a re-run resumes where it stopped and
            # opens no duplicates.
            for attempt in 1 2 3; do
              echo "::group::mirror $label (attempt $attempt)"
              HANDOFF_GROUP="$section" ./handoff mirror
              status=$?
              echo "::endgroup::"
              [ $status -eq 0 ] && break
              if [ $attempt -eq 3 ]; then
                echo "::error::mirror failed for section $label after 3 attempts"
                rc=1
              else
                echo "::warning::mirror failed for section $label, retrying"
                sleep $((attempt * 5))
              fi
            done
          done
          exit $rc

      - name: Commit the drift report if it changed
        # `always()` so a divergence found before a later section failed is still recorded. The
        # report is what a reader acts on; losing it because an unrelated section errored would
        # hide the one thing the run learned.
        if: always()
        working-directory: __BOARD_PATH__
        run: |
          set -uo pipefail
          # TRACKER-DRIFT.md is generated: written when a divergence appears, left untouched while
          # it stands, and DELETED when it clears. So all three of created, unchanged and removed
          # are normal, and the common case is no change at all — commit only when something moved,
          # or this job appends an empty commit to the board on every push forever.
          git add -A
          if git diff --cached --quiet; then
            echo "no drift change — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(other): refresh tracker drift report

          Generated by the handoff mirror. Drift is reported, never reconciled — a
          close made in the tracker never becomes \`done\` on the board (ADR 0014)."
          git push
